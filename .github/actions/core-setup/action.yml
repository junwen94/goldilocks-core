name: Core setup
description: >-
  The pinned uv and the frozen dev environment with every extra; shared by
  the quality and mutation jobs of ci.yml (#237). Magnetic orderings need no
  external program (#308).
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.3"
        enable-cache: true

    - name: Install frozen dependencies
      shell: bash
      run: uv sync --group dev --all-extras

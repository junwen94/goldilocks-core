name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality-and-test:
    name: Quality, tests, and mutations
    runs-on: ubuntu-latest
    # Confirmed 2026-09-22: a real, crash-free mutmut run (post-forkserver-fix,
    # #104) reached 813/817 mutants at exactly 30m22s before the job's own
    # 30-minute ceiling cut it off -- lint+pytest+enumlib setup alone already
    # eat a meaningful chunk of that budget, so mutation testing was never
    # actually given a comfortable margin to finish in the first place.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --group dev --all-extras

      # Known gap: this clones and rebuilds enumlib from source on every CI run,
      # with no retry around the network calls and no cache keyed on the pinned
      # ref. Worth hardening the same way src/goldilocks_core/assets/download.py
      # retries/backs off PSDI downloads, but that needs real CI validation this
      # pass didn't do -- flagging for a future pass rather than guessing at it.
      - name: Build enumlib (external dependency for AFM species-splitting)
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran
          git clone --recursive --depth 1 https://github.com/msg-byu/enumlib.git /tmp/enumlib
          make -C /tmp/enumlib/symlib/src F90=gfortran
          make -C /tmp/enumlib/src F90=gfortran
          make -C /tmp/enumlib/src F90=gfortran enum.x
          install -d /tmp/enumlib-bin
          install /tmp/enumlib/src/enum.x /tmp/enumlib-bin/enum.x
          sed "1s|.*|#!${{ github.workspace }}/.venv/bin/python3|" \
            /tmp/enumlib/aux_src/makeStr.py > /tmp/enumlib-bin/makeStr.py
          chmod +x /tmp/enumlib-bin/makeStr.py
          echo "/tmp/enumlib-bin" >> "$GITHUB_PATH"

      - name: Ruff check
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Import and cyclomatic complexity ceilings
        run: uv run python scripts/check_complexity.py

      - name: Pytest with branch coverage
        run: >-
          uv run pytest --cov --cov-report=term-missing:skip-covered
          --cov-report=xml

      - name: Mutation testing
        # Paused on pushes and PRs while the e2e bug-fix round lands (#195);
        # run on demand with `gh workflow run ci.yml --ref v2`. Re-enable: #196.
        if: github.event_name == 'workflow_dispatch'
        run: |
          # --max-children 2: commit aabcefd lowered this from 4 to fix a mutmut
          # internal PID-tracking race (KeyError in read_one_child_exit_status)
          # that was crashing runs on 2-core ubuntu-latest runners. Do not raise
          # this back up without confirming the race is actually fixed upstream.
          uv run mutmut run --max-children 2
          uv run mutmut export-cicd-stats
          uv run python scripts/check_mutation_score.py \
            mutants/mutmut-cicd-stats.json --minimum 0.74 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  workbench:
    name: Workbench types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install frozen HTTP dependencies
        run: uv sync --frozen --no-dev --extra http

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen Workbench dependencies
        working-directory: web
        run: npm ci

      - name: Lint, test, and build Workbench
        working-directory: web
        run: npm run check

      # Lints the Dockerfile only. Building the image downloads every runtime
      # asset, so the build and browser e2e run in workbench-image.yml, for
      # release tags and on dispatch (#205).
      - name: Check production image definition
        run: docker build --check .

  package-build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Build source and wheel distributions
        run: uv build --no-sources

      - name: Verify distribution contents
        run: python scripts/validate_distribution.py dist

# Extra cross-platform check. Runs the Python gates on macOS and Windows
# runners and the arm64 image build on the native arm runner. Linux coverage
# stays in quality.yml; Docker/image e2e remain Linux-only there.
name: platform

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  image-arm64:
    name: Image arm64 build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build arm64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --group dev --all-extras

      - name: Lint
        run: uv run just lint

      - name: Tests
        run: uv run just test

      - name: CLI smoke
        run: uv run goldilocks --help

      - name: Build distributions
        run: uv build --no-sources

name: Publish on PyPI

# Driven by a tag, so what reaches PyPI is always a commit in the history.
# Shaped after stfc/goldilocks-ml's own release workflow (itself modeled on
# stfc/janus-core's), so every package in this ecosystem releases the same
# way.
on:
  push:
    tags:
      # After vMajor.Minor.Patch anything is allowed, except "/".
      - v[0-9]+.[0-9]+.[0-9]+*

jobs:
  publish:
    runs-on: ubuntu-latest
    # A fork that pushes a tag must not try to publish.
    if: github.repository == 'stfc/goldilocks-core'
    environment:
      # Registered as the trusted publisher's environment on PyPI. Renaming
      # it here means editing the publisher there too, or the upload is
      # refused.
      name: pypi
      url: https://pypi.org/p/goldilocks-core
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
      # For creating the GitHub release.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"

      # A tag that disagrees with the packaged version publishes a release
      # nobody can find from the history.
      - name: Check the tag matches the packaged version
        run: |
          packaged=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged"
            exit 1
          fi

      # Bundled into the wheel (#122) so `pip install goldilocks-core[http]`
      # serves the real Workbench, not just the API -- a plain `uv build`
      # outside this workflow never runs these two steps, so src/goldilocks_
      # core/webapp/ stays absent (and the package-data glob matching it
      # matches nothing) for every other build path.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/'s own `prebuild` script (generate:api) runs `uv run --frozen
      # --no-sync ../scripts/export_workbench_openapi.py`, which imports
      # goldilocks_core[http] -- needs a real synced venv to import from,
      # not just the sdist/wheel `uv build` produces later.
      - name: Install goldilocks-core itself, for the OpenAPI schema export
        run: uv sync --frozen --extra http

      - name: Build the Workbench frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Bundle the built frontend into the package
        run: |
          mkdir -p src/goldilocks_core/webapp
          cp -r web/dist/. src/goldilocks_core/webapp/

      - name: Build
        run: uv build

      - name: Check the artifacts are well formed
        run: uvx twine check --strict dist/*

      # A silently-empty package-data glob (e.g. the wheel's own internal
      # layout changing under it) would ship an API-only wheel with no
      # error anywhere -- exactly the #122 bug this workflow exists to fix,
      # just reintroduced. Fail loudly instead.
      - name: Check the Workbench frontend actually made it into the wheel
        run: |
          if ! unzip -l dist/*.whl | grep -q 'goldilocks_core/webapp/index.html'; then
            echo "::error::the built wheel has no bundled Workbench frontend"
            exit 1
          fi

      - name: Create the GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          skipIfReleaseExists: true
          generateReleaseNotes: true

      - name: Publish to PyPI
        run: uv publish

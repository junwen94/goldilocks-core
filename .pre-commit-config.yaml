# Fast gates only. The full pre-PR gate is `uv run just check`;
# mutation testing and distribution checks run in CI.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: complexity
        name: Import and cyclomatic complexity ceilings
        entry: uv run --frozen --no-sync python scripts/check_complexity.py
        language: system
        pass_filenames: false
        always_run: true
